<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Refreshing playable</title></head>
<body>
<script>
(async () => {
  if ("serviceWorker" in navigator) {
    const registrations = await navigator.serviceWorker.getRegistrations();
    await Promise.all(registrations.map((registration) => registration.unregister()));
  }
  const keys = await caches.keys();
  await Promise.all(keys.map((key) => caches.delete(key)));
  location.replace("./?cache-reset=20260724");
})().catch(() => location.replace("./?cache-reset=20260724"));
</script>
</body>
</html>
